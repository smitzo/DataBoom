[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "boom-data"
version = "0.1.0"
description = "Relationship-aware synthetic data generation engine for PostgreSQL schemas."
readme = "instructions.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124,<1.0",
    "faker>=39.0,<40.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "typer>=0.24,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.14,<1.0",
]

[project.scripts]
boom-data = "boom_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/boom_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
