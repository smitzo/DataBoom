services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boom_data
      POSTGRES_USER: boom_data
      POSTGRES_PASSWORD: boom_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boom_data -d boom_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    profiles:
      - tools
    environment:
      BOOM_DATA_ENV: docker
      BOOM_DATA_ARTIFACT_ROOT: /app/artifacts
      BOOM_DATA_DATABASE_URL: postgresql+psycopg://boom_data:boom_data@postgres:5432/boom_data
      BOOM_DATA_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
