name: databoom

services:
  api:
    build:
      context: .
    command:
      [
        "uvicorn",
        "databoom.api:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      DATABOOM_ENV: docker
      DATABOOM_ARTIFACT_ROOT: /app/artifacts
      DATABOOM_DATABASE_URL: postgresql+psycopg://databoom:databoom@postgres:5432/databoom
      DATABOOM_REDIS_URL: redis://redis:6379/0
      DATABOOM_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "${DATABOOM_API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: databoom
      POSTGRES_USER: databoom
      POSTGRES_PASSWORD: databoom
    ports:
      - "${DATABOOM_POSTGRES_BIND:-127.0.0.1}:${DATABOOM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databoom -d databoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${DATABOOM_REDIS_BIND:-127.0.0.1}:${DATABOOM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    profiles:
      - tools
    command: ["databoom", "info"]
    environment:
      DATABOOM_ENV: docker
      DATABOOM_ARTIFACT_ROOT: /app/artifacts
      DATABOOM_DATABASE_URL: postgresql+psycopg://databoom:databoom@postgres:5432/databoom
      DATABOOM_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
