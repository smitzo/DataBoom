name: databoom

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: databoom
      POSTGRES_USER: databoom
      POSTGRES_PASSWORD: databoom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databoom -d databoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    profiles:
      - tools
    environment:
      DATABOOM_ENV: docker
      DATABOOM_ARTIFACT_ROOT: /app/artifacts
      DATABOOM_DATABASE_URL: postgresql+psycopg://databoom:databoom@postgres:5432/databoom
      DATABOOM_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
